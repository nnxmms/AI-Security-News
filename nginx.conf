server {
    listen 443 ssl;
    server_name hacking-and-security.de;

    ssl_certificate /cert/hacking-and-security.de.crt;
    ssl_certificate_key /cert/hacking-and-security.de.key;

    # Handle newsletter requests
    location /newsletter/ {
        proxy_pass http://newsletter-server-1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files
    location /newsletter/static/ {
        proxy_pass http://newsletter-server-1:5000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}