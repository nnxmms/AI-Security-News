<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Security News</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }
        header {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        .header-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px; /* Increased padding for better spacing */
            text-align: center;
        }
        h1 {
            font-size: 48px; /* Regular size for desktop */
            margin-bottom: 20px; /* Adjusted margin */
            color: #000;
            font-weight: normal;
        }
        .subtitle {
            font-size: 20px; /* Regular size for desktop */
            color: #333;
            margin-bottom: 50px; /* Adjusted margin */
            font-weight: normal;
            line-height: 1.5;
        }
        .email-input {
            width: 90%; /* Set width relative to the container */
            max-width: 400px; /* Adjusted maximum width */
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            margin: 10px 0; /* Adjusted margin */
        }
        .email-input:focus {
            outline: none;
            border-color: #999;
        }
        .button-group {
            display: flex;
            flex-direction: row; /* Side by side on desktop */
            justify-content: center;
            gap: 15px; /* Added gap between buttons */
            margin-top: 20px;
        }
        .btn {
            padding: 12px 20px; /* Adjusted padding */
            border: 1px solid #333;
            border-radius: 10px;
            background-color: white;
            color: #333;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1; /* Allow buttons to take same space */
            max-width: 200px; /* Set max width for buttons */
        }
        .btn:hover {
            background-color: #f5f5f5;
        }
        .error-message {
            color: #ED556C; /* Red color for error messages */
            margin-top: 20px;
            font-style: italic; /* Make the error message italic */
        }
        .success-message {
            color: #006B3C; /* Green color for success messages */
            margin-top: 20px;
            font-style: italic;
        }
        footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }
        footer a.footer-link {
            color: #666;
            text-decoration: none;
        }
        footer a.footer-link:hover {
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 36px; /* Reduced for mobile */
            }
            .subtitle {
                font-size: 18px; /* Reduced for mobile */
            }
            .btn {
                width: 20%; /* Full width for buttons on mobile */
                max-width: none; /* Override max width on mobile */
            }
        }
    </style>
</head>
<body>
<header>
    <a href="https://www.linkedin.com/in/philipp-zimmermann-dtsec" target="_blank">
        <img src="/newsletter/static/images/Philipp_Zimmermann.jpg" alt="Philipp Zimmermann" class="header-img">
    </a>
</header>
<div class="container">
    <h1>AI Security News</h1>
    <p class="subtitle">
        Stay updated on the latest advancements in AI Security research.<br>
        Sign up to the AI Security Newsletter today!
    </p>

    <!-- Display error message if exists -->
    {% if error %}
        <div class="error-message">{{ error }}</div>
    {% endif %}

    <!-- Display success message if exists -->
    {% if success %}
        <div class="success-message">{{ success }}</div>
    {% endif %}
  
    <input type="email" id="email" class="email-input" placeholder="Your email address" required>
    <div class="button-group">
        <form action="/newsletter/signup" method="post">
            <input type="hidden" name="email" id="signup-email">
            <button type="submit" class="btn" onclick="copyEmail('signup-email')">Sign Up</button>
        </form>
        <form action="/newsletter/optout" method="post">
            <input type="hidden" name="email" id="optout-email">
            <button type="submit" class="btn" onclick="copyEmail('optout-email')">Opt Out</button>
        </form>
    </div>
</div>
<footer>
    <a href="https://hacking-and-security.de" class="footer-link">Hacking and Security</a>
</footer>

<script>
function copyEmail(targetId) {
    const emailInput = document.getElementById('email');
    const targetInput = document.getElementById(targetId);
    targetInput.value = emailInput.value;
}
</script>
</body>
</html>
